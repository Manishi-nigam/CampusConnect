<app-toast></app-toast>

<div class="app-layout" [class.no-layout]="!auth.isLoggedIn() || isLoginPage()">
  <app-sidebar *ngIf="auth.isLoggedIn() && !isLoginPage()"></app-sidebar>
  <div class="app-main">
    <app-topbar *ngIf="auth.isLoggedIn() && !isLoginPage()"></app-topbar>
    <main class="app-content" [class.full-content]="!auth.isLoggedIn() || isLoginPage()">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
